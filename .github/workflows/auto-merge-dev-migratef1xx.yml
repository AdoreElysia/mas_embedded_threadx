name: Auto-merge dev → dev-migratef1xx

on:
  push:
    branches:
      - dev

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

      - name: Merge dev into dev-migratef1xx
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config merge.ours.driver true

          git checkout dev-migratef1xx

          if git merge origin/dev -m "Auto-merge dev into dev-migratef1xx"; then
            echo "MERGE_OK=true" >> $GITHUB_ENV
          else
            echo "MERGE_OK=false" >> $GITHUB_ENV
            git merge --abort
          fi

      - name: Push merged branch
        if: env.MERGE_OK == 'true'
        run: git push origin dev-migratef1xx

      - name: Notify conflict — create PR
        if: env.MERGE_OK == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}
          base: dev-migratef1xx
          branch: auto/dev-merge-conflict-migratef1
          title: "⚠️ Merge conflict: dev → dev-migratef1xx"
          body: |
            Auto-merge from `dev` failed due to conflicts.
            Resolve manually:

            ```bash
            git fetch origin
            git checkout dev-migratef1xx
            git merge origin/dev
            # resolve conflicts, commit, then:
            git push origin dev-migratef1xx
            ```
          delete-branch: true